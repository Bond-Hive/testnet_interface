<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bondhive – Scheduled Maintenance</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top left, #1b0c2c, #0a0612);
      color: #e6e3f4;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      flex-direction: column;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 640px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      margin-bottom: 3rem;
    }

    .logo img {
      height: 80px;
      width: auto;
      opacity: 0.95;
      transition: opacity 0.3s ease;
    }

    .logo img:hover {
      opacity: 1;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      margin-bottom: 1.5rem;
      color: #d3bfff;
      font-weight: 600;
      line-height: 1.2;
    }

    p {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: #b4aad2;
      max-width: 100%;
      line-height: 1.6;
      margin-bottom: 0;
    }

    .button {
      margin-top: 2.5rem;
      padding: 1rem 2.5rem;
      background: linear-gradient(to right, #6e31ff, #b24dff);
      border: none;
      border-radius: 16px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(178, 77, 255, 0.3);
      transition: all 0.3s ease;
      display: inline-block;
      min-width: 200px;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(178, 77, 255, 0.5);
      background: linear-gradient(to right, #7c3aff, #c454ff);
    }

    .button:active {
      transform: translateY(-1px);
    }

    /* Mobile optimizations */
    @media (max-width: 768px) {
      body {
        padding: 1.5rem 1rem;
      }

      .logo {
        margin-bottom: 2rem;
      }

      .logo img {
        height: 64px;
      }

      h1 {
        margin-bottom: 1rem;
      }

      p {
        padding: 0 0.5rem;
      }

      .button {
        margin-top: 2rem;
        padding: 0.9rem 2rem;
        font-size: 1rem;
        min-width: 180px;
        width: 100%;
        max-width: 280px;
      }
    }

    /* Small mobile devices */
    @media (max-width: 480px) {
      body {
        padding: 1rem 0.75rem;
      }

      .logo img {
        height: 56px;
      }

      .button {
        padding: 1rem 1.5rem;
        margin-top: 1.5rem;
      }
    }

    /* Large desktop */
    @media (min-width: 1200px) {
      .logo img {
        height: 96px;
      }

      h1 {
        font-size: 3rem;
      }

      p {
        font-size: 1.375rem;
      }

      .button {
        padding: 1.1rem 3rem;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/Bond-Hive/interface/refs/heads/main/public/PNG/blueBondhive.png" alt="Bondhive logo" />
    </div>
    <h1>We'll be back shortly</h1>
    <p>Bondhive is currently undergoing maintenance. We're making improvements and will be back online soon. Thank you for your patience.</p>
    <a href="https://t.me/bondHive" class="button">Join our Telegram</a>
  </div>
</body>
</html>
